# GoFilm LAN stack: MySQL + Redis for a home / LAN server.
#
# MySQL and Redis are published on 127.0.0.1 only on purpose: they are an
# implementation detail of the backend, which also runs on this host.
# Never expose them to the LAN, and never weaken the media proxy checks
# (server/plugin/mediaproxy) that block SSRF from upstream video hosts.
#
# Passwords come from the .env file next to this compose file (generated by
# deploy-lan.ps1 / deploy-lan.sh). Keep that file private.
name: gofilm-lan

services:
  mysql:
    image: mysql:8.4
    container_name: gofilm_lan_mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LAN_MYSQL_PORT:-3611}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${LAN_MYSQL_ROOT_PASSWORD:?LAN_MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${LAN_MYSQL_DATABASE:-FilmSite}
      MYSQL_USER: ${LAN_MYSQL_USER:-gofilm}
      MYSQL_PASSWORD: ${LAN_MYSQL_PASSWORD:?LAN_MYSQL_PASSWORD is required}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+8:00
      - --lower-case-table-names=1
    volumes:
      - gofilm_lan_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: gofilm_lan_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LAN_REDIS_PORT:-3621}:6379"
    environment:
      REDIS_PASSWORD: ${LAN_REDIS_PASSWORD:?LAN_REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save 900 1 --appendonly yes"]
    volumes:
      - gofilm_lan_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  gofilm_lan_mysql_data:
  gofilm_lan_redis_data:
